<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 25th Birthday, Jiya</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2410;--soft:#8a5a3a;--card:rgba(255,250,240,.55);--line:rgba(255,255,255,.9);--shadow:rgba(180,83,9,.22);--base:#fff6e6;--g1:#ffd89b;--g2:#ffbfa3;--g3:#fff0c2;--acc:#d9730d;--acc2:#c2255c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff1dc;--soft:#e6c4a0;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.4);--base:#24120a;--g1:#6b3208;--g2:#6b1d3a;--g3:#4a3a08;}}
:root[data-theme="dark"]{--ink:#fff1dc;--soft:#e6c4a0;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.4);--base:#24120a;--g1:#6b3208;--g2:#6b1d3a;--g3:#4a3a08;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html,body{margin:0}
body{background:radial-gradient(circle at 10% 8%,var(--g1),transparent 45%),radial-gradient(circle at 92% 22%,var(--g2),transparent 45%),radial-gradient(circle at 40% 95%,var(--g3),transparent 50%),var(--base);background-attachment:fixed;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden}
#root{padding:0 18px 40px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
section{width:100%;max-width:560px;margin:0 auto;padding:26px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
h1,h2{font-family:'DM Serif Display',system-ui,sans-serif;font-weight:400;margin:0;line-height:1.1}
h1{font-size:clamp(28px,7.5vw,46px)}h2{font-size:clamp(24px,6.5vw,32px)}
p{margin:0;line-height:1.6;color:var(--soft);max-width:420px}
.chip,.glass{background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--line);box-shadow:0 16px 48px var(--shadow)}
.chip{padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px;color:var(--soft);box-shadow:none}
.glass{border-radius:28px;width:100%}
.big{font:400 clamp(100px,30vw,180px)/.9 'DM Serif Display',sans-serif;letter-spacing:-.03em;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
.sky{position:relative;width:100%;height:200px;margin-top:6px}
.bal{position:absolute;width:56px;height:70px;padding:0;border:0;border-radius:50% 50% 48% 48%;cursor:pointer;box-shadow:inset -7px -9px 0 rgba(0,0,0,.1),0 8px 18px var(--shadow);animation:bob 4s ease-in-out infinite}
.bal::before{content:"";position:absolute;left:13px;top:11px;width:9px;height:17px;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(25deg)}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:44px;background:var(--soft);opacity:.45}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
.wish{min-height:118px;padding:18px 20px;display:flex;align-items:center;justify-content:center;white-space:pre-line;line-height:1.65;font-size:16px;animation:in .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
button{font:600 15px 'DM Sans',sans-serif;padding:13px 26px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(194,37,92,.3);transition:transform .15s}
button:active{transform:scale(.97)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.card{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cake{width:min(360px,88vw);overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1) rotate(-4deg)}to{transform:scale(.88,1.12) rotate(4deg)}}
.smoke{animation:rs 2s ease-out forwards}@keyframes rs{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.slice{transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-origin:300px 280px}.slice.cut{transform:translate(36px,14px) rotate(8deg)}
.meter{width:180px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--acc2);transition:width .1s}
.paper{width:100%;padding:28px 22px;text-align:left;min-height:320px;border-radius:18px;background:linear-gradient(#fff8e6,#ffedc2);color:#5a3216;box-shadow:0 18px 40px var(--shadow);transform:rotate(-.8deg);font-family:'Caveat',cursive;font-weight:700;font-size:clamp(23px,6vw,29px);line-height:1.4;white-space:pre-wrap}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;vertical-align:-3px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.hint{font-size:14px}
  .dots{display:flex;gap:8px;justify-content:center;padding-top:16px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.3s}.dots i.on{background:var(--acc);transform:scale(1.3)}
.stage{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;animation:in .6s cubic-bezier(.3,1.5,.5,1) both}
@media (prefers-reduced-motion:reduce){.bal,.flame,.big,.wish{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement, { useState, useEffect, useRef } = React;
const COL = ['#f59e0b','#e8590c','#d6336c','#fa8072','#fcc419','#ae3ec9'];
const WISHES = [
  '🎂 Welcome to 25, Jiya! Same iconic you, now with 100% more life experience.',
  '🌸 Roses are red, violets are blue,\nthe world got luckier the day there was you. 💕',
  '✨ May your year be full of tiny joys: good coffee, loud laughs and plans that actually happen.',
  '💌 You are the friend people pray for.\nI am so glad you are mine.',
  '🌙 May every worry you carry\nbecome lighter than a balloon,\nand every dream you chase\ncome true before the next full moon. 🎈',
  '🥂 Here is to brave choices, soft landings and a year that feels like a warm hug.',
  '🌟 You turned 25 and the sky got a new star.\nMake it a great one, Jiya. 💫',
  '🍰 Eat the cake, take the trip, say yes to the plan.\nYour year, your rules! 😄'];
const LETTER = 'Dear Jiya,\n\nHappy 25th birthday! 🎂\n\nSome people walk into your life and quietly make everything better. You did that for me. Thank you for the honest advice, the endless laughter and for always being exactly who you are.\n\nI hope this year gives you everything you give to others: love, patience and the very best surprises. Never dim your light, my girl. 💖\n\nLove you always,\nYour bestie';

function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d'); let P = [], id = 0;
    const rs = () => { c.width = innerWidth; c.height = innerHeight; }; rs(); addEventListener('resize', rs);
    window.fire = (x, y, n = 40, up = 0) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 7;
      P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3 - up, r: Math.random() * 6, vr: (Math.random() - .5) * .4, s: 7 + Math.random() * 8, c: COL[i % 6] }); } };
    window.fireBig = () => { fire(innerWidth * .15, innerHeight * .75, 70, 6); fire(innerWidth * .85, innerHeight * .75, 70, 6); fire(innerWidth * .5, innerHeight * .4, 60); };
    const t = () => { ctx.clearRect(0, 0, c.width, c.height); P = P.filter(p => p.y < c.height + 30);
      for (const p of P) { p.vy += .14; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
      id = requestAnimationFrame(t); }; t();
    return () => { cancelAnimationFrame(id); removeEventListener('resize', rs); };
  }, []);
  return h('canvas', { ref, 'aria-hidden': true });
}

const POS = [[3,36],[17,4],[31,44],[45,8],[59,40],[73,2],[86,34]];
function Hero({ next }) {
  const [gone, setGone] = useState([]);
  const n = gone.length, left = POS.length - n;
  useEffect(() => { const t = setTimeout(() => fireBig(), 600); return () => clearTimeout(t); }, []);
  const pop = (i, e) => { const r = e.currentTarget.getBoundingClientRect(); fire(r.left + r.width / 2, r.top + r.height / 2, 34); setGone(g => [...g, i]); };
  return h('section', null,
    h('span', { className: 'chip' }, 'For Javeria, a.k.a. Jiya'), h('div', { className: 'big' }, '25'),
    h('h1', null, 'Happy Birthday, Jiya!'),
    h('div', { className: 'sky' }, POS.map((p, i) => !gone.includes(i) && h('button', { key: i, className: 'bal', 'aria-label': 'Pop balloon for a wish',
      style: { left: p[0] + '%', top: p[1] + '%', background: COL[i % 6], animationDelay: i * -.6 + 's' }, onClick: e => pop(i, e) }))),
    h('div', { className: 'glass wish', key: n, 'aria-live': 'polite' }, n ? WISHES[(n - 1) % WISHES.length] : 'Pop a balloon to read a wish. 🎈'),
    left ? h('p', { className: 'hint' }, left + ' balloons left') : h('button', { onClick: next }, 'Light the candles'));
}

function Cake({ lit, cut, onCandle, name }) {
  const xs = [118, 150, 182, 214, 246];
  const body = h('g', null,
    h('ellipse', { cx: 180, cy: 280, rx: 150, ry: 14, fill: '#5a3a78', opacity: .18 }),
    h('rect', { x: 40, y: 200, width: 280, height: 76, rx: 16, fill: '#e85d75' }),
    h('path', { d: 'M40 214' + ' q18 22 35 0'.repeat(8) + ' v-14 h-280z', fill: '#fffaf3' }),
    h('rect', { x: 78, y: 140, width: 204, height: 64, rx: 14, fill: '#ffd98a' }),
    h('path', { d: 'M78 152' + ' q17 20 34 0'.repeat(6) + ' v-12 h-204z', fill: '#fffaf3' }),
    [100, 140, 180, 220, 260].map((x, i) => h('circle', { key: x, cx: x, cy: 188, r: 5, fill: COL[i + 1] })),
    h('text', { x: 180, y: 177, textAnchor: 'middle', fontFamily: 'Caveat, cursive', fontSize: 27, fontWeight: 700, fill: '#7c2d12' }, name),
    lit && xs.map((x, i) => h('g', { key: x, onClick: () => onCandle(i), style: { cursor: 'pointer' } },
      h('rect', { x: x - 12, y: 60, width: 24, height: 84, fill: 'transparent' }),
      h('rect', { x: x - 5, y: 98, width: 10, height: 44, rx: 3, fill: COL[i % 6] }),
      lit[i] ? h('g', null, h('ellipse', { cx: x, cy: 86, rx: 14, ry: 20, fill: '#ffc93c', opacity: .25 }),
        h('path', { className: 'flame', d: `M${x} 70 c9 10 9 22 0 28 c-9 -6 -9 -18 0 -28z`, fill: '#ff9a1f' }),
        h('path', { className: 'flame', d: `M${x} 80 c4 5 4 11 0 14 c-4 -3 -4 -9 0 -14z`, fill: '#fff3b0' }))
        : h('path', { className: 'smoke', d: `M${x} 96 q-6 -10 0 -18 q6 -8 0 -16`, stroke: '#b9a8cc', strokeWidth: 3, fill: 'none', strokeLinecap: 'round' }))));
  return h('svg', { className: 'cake', viewBox: '0 0 360 300', role: 'img', 'aria-label': 'Birthday cake' },
    h('defs', null, h('clipPath', { id: 'cl' }, h('rect', { x: 0, y: 0, width: 300, height: 300 })), h('clipPath', { id: 'cr' }, h('rect', { x: 300, y: 0, width: 80, height: 300 }))),
    cut ? [h('g', { key: 'l', clipPath: 'url(#cl)' }, body), h('g', { key: 'r', clipPath: 'url(#cr)', className: 'slice' + (cut === 2 ? ' cut' : '') }, body)] : body);
}

function CakeSection({ next }) {
  const [lit, setLit] = useState([true, true, true, true, true]), [cut, setCut] = useState(0), [mic, setMic] = useState(false), [lvl, setLvl] = useState(0), [err, setErr] = useState('');
  const out = i => setLit(l => l.map((v, j) => j === i ? false : v));
  const dark = lit.every(v => !v);
  useEffect(() => { if (dark && !cut) fireBig(); }, [dark]);
  useEffect(() => {
    if (!mic) return; let stop = false, ac, stream, id, k = 0;
    (async () => { try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true }); ac = new (window.AudioContext || window.webkitAudioContext)();
      const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an); const d = new Uint8Array(an.fftSize);
      const loop = () => { if (stop) return; an.getByteTimeDomainData(d); let s = 0; for (const v of d) s += ((v - 128) / 128) ** 2; const r = Math.sqrt(s / d.length);
        setLvl(Math.min(1, r * 5)); if (r > .09 && ++k % 8 === 0) setLit(l => { const j = l.findIndex(Boolean); return j < 0 ? l : l.map((v, x) => x === j ? false : v); });
        id = requestAnimationFrame(loop); }; loop();
    } catch (e) { setErr('Mic unavailable. Tap the candles instead.'); setMic(false); } })();
    return () => { stop = true; cancelAnimationFrame(id); stream && stream.getTracks().forEach(t => t.stop()); ac && ac.close(); };
  }, [mic]);
  const blow = () => lit.forEach((v, i) => v && setTimeout(() => out(i), i * 220));
  const slice = () => { setCut(1); setTimeout(() => { setCut(2); fire(innerWidth / 2, innerHeight * .5, 60); }, 60); };
  const again = () => { setCut(0); setLit([true, true, true, true, true]); };
  return h('section', null, h('h2', null, cut ? 'Happy birthday, Jiya! 🥳' : 'Make a wish ✨'),
    h('div', { className: 'glass card' }, h(Cake, { lit: cut ? null : lit, cut, onCandle: out, name: 'Jiya' }),
      mic && !dark && h('div', { className: 'meter', 'aria-hidden': true }, h('i', { style: { width: lvl * 100 + '%' } })),
      !dark && h('div', { className: 'row' }, h('button', { onClick: () => setMic(m => !m) }, mic ? 'Stop mic' : 'Blow into mic'), h('button', { className: 'ghost', onClick: blow }, 'Tap to blow')),
      dark && !cut && h('button', { onClick: slice }, 'Cut the cake'),
      cut === 2 && h('div', { className: 'row' }, h('button', { onClick: next }, 'Open the letter'), h('button', { className: 'ghost', onClick: again }, 'Light candles again')),
      !dark && h('p', { className: 'hint' }, err || 'Use the mic or tap. You can also tap each candle.')));
}

function Letter({ again }) {
  const [n, setN] = useState(0);
  useEffect(() => { fireBig(); }, []);
  useEffect(() => { if (n >= LETTER.length) return; const t = setTimeout(() => setN(n + 1), 30); return () => clearTimeout(t); }, [n]);
  return h('section', null, h('h2', null, 'A note for you'),
    h('div', { className: 'paper' }, LETTER.slice(0, n), n < LETTER.length && h('span', { className: 'caret' })),
    h('div', { className: 'row' }, h('button', { onClick: () => fireBig() }, 'More confetti 🎉'), h('button', { className: 'ghost', onClick: again }, 'Play again')));
}

function App() {
  const [s, setS] = useState(0), nx = () => setS(x => x + 1);
  return h(React.Fragment, null, h(Confetti), h('div', { className: 'dots', 'aria-hidden': true }, [0, 1, 2].map(i => h('i', { key: i, className: i <= s ? 'on' : '' }))),
    h('main', { className: 'stage', key: s }, s === 0 ? h(Hero, { next: nx }) : s === 1 ? h(CakeSection, { next: nx }) : h(Letter, { again: () => setS(0) })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
